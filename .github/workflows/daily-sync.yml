name: Sync Data Every 15 Minutes
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: "https://bwspcsiazbwrrxpgoldx.supabase.co"
      SUPABASE_ANON_KEY: ${ secrets.SUPABASE_ANON_KEY }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python fetch_supabase_data.py
      - run: python scripts/classify_distress.py --input supabase_data/market_listings.json --output distress_output
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${ secrets.GITHUB_TOKEN }
          publish_dir: ./site