name: Validate dashboard site

# نشر فرع gh-pages تم نقله إلى مستودع البحث (alforaij-research-assistant):
# workflow `deploy-alforaijboard.yml` يدفع واجهة `frontend/` الحقيقية إلى فرع
# gh-pages هنا. كان هذا الملف يدفع نسخة `site/` القديمة إلى نفس الفرع
# فيتعارض المصدران (آخر من ينتهي يفوز) — أُوقف هذا الدفع نهائيًا.
# هذا الملف الآن يتحقق فقط من سلامة أصول `site/` عند تعديلها.

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "agent/validate_static_site.py"
      - ".github/workflows/update-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate deployment artifact
        run: python agent/validate_static_site.py
