name: Update dashboard site

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules run in UTC. 03:00 UTC = 06:00 Kuwait time.
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r agent/requirements.txt

      - name: Refresh data register
        run: python agent/refresh_dashboard_register.py

      - name: Build static site
        run: python agent/build_static_site.py

      - name: Commit updated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          if git diff --cached --quiet; then
            echo "No site changes to commit."
          else
            git commit -m "Update dashboard site"
            git push
          fi
