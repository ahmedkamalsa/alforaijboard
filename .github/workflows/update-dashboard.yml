name: Update dashboard site

on:
  push:
    branches:
      - main
    paths:
      - "agent/**"
      - ".github/workflows/update-dashboard.yml"
      - "netlify.toml"
  workflow_dispatch:
  schedule:
    # GitHub schedules run in UTC. 03:00 UTC = 06:00 Kuwait time.
    - cron: "0 3 * * *"

permissions:
  contents: write

concurrency:
  group: dashboard-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r agent/requirements.txt

      - name: Refresh data register
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python agent/refresh_dashboard_register.py; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 20))
          done

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python agent/build_static_site.py; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 20))
          done

      - name: Validate deployment artifact
        run: python agent/validate_static_site.py

      - name: Commit updated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          if git diff --cached --quiet; then
            echo "No site changes to commit."
          else
            git commit -m "Update dashboard site"
            git push
          fi

      - name: Publish GitHub Pages branch
        run: |
          git subtree split --prefix site -b gh-pages-build
          git push -f origin gh-pages-build:gh-pages
