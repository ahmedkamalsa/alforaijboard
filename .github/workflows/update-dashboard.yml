name: Update dashboard site

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "agent/validate_static_site.py"
      - ".github/workflows/update-dashboard.yml"
      - "netlify.toml"
  workflow_dispatch:
  schedule:
    # Keep the published branch warm without rebuilding the old dashboard.
    - cron: "0 3,9,15,21 * * *"

permissions:
  contents: write

concurrency:
  group: dashboard-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate deployment artifact
        run: python agent/validate_static_site.py

      - name: Publish GitHub Pages branch
        run: |
          git subtree split --prefix site -b gh-pages-build
          git push -f origin gh-pages-build:gh-pages
